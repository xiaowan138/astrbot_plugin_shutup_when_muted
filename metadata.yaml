name: astrbot_plugin_shutup_when_muted
display_name: 被禁言了我闭嘴
short_desc: 机器人被群禁言时自动闭嘴,解禁后恢复发言
desc: 监听 OneBot v11 群禁言通知,机器人自己被禁言后自动拦截发往该群的所有消息发送(含 AI 回复、其他插件回复、主动发送),避免触发 QQ 风控;解除禁言或禁言时长到期后自动恢复。
help: 无需手动操作。机器人被群禁言后自动对该群闭嘴,解禁自动恢复。管理员可私聊发送 /闭嘴状态 查看、/闭嘴解除 [群号] 手动解除。
version: 1.0.0
author: xiaowan
repo: ""
astrbot_version: ">=4.0.0"
support_platforms:
  - aiocqhttp
