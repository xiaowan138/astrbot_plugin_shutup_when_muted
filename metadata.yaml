name: astrbot_plugin_shutup_when_muted
display_name: 被禁言了我闭嘴
short_desc: 机器人被群禁言(或群全员禁言)时自动闭嘴,解禁后恢复发言
desc: 监听 OneBot v11 群禁言通知,机器人自己被禁言或群开启全员禁言后,自动拦截发往该群的所有消息发送(含 AI 回复、其他插件回复、主动发送),避免触发 QQ 风控;解除禁言或禁言时长到期后自动恢复。支持手动闭嘴/解除、拦截计数、状态持久化。
help: 无需手动操作。机器人被群禁言(或群开全员禁言)后自动对该群闭嘴,解禁自动恢复。管理员可私聊发送 /闭嘴状态 查看、/闭嘴解除 [群号] 手动解除、/闭嘴 [群号] 手动闭嘴。
version: 1.1.0
author: xiaowan
repo: ""
astrbot_version: ">=4.0.0"
support_platforms:
  - aiocqhttp
